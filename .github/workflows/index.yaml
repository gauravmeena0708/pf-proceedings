name: OCR-index EPFO order PDFs (optional)

# Manual only. OCR is slow and dependency-heavy, so it is never scheduled.
# Each run indexes up to `index-limit` new PDFs and commits index-data.json,
# so it can be triggered repeatedly to work through the backlog incrementally.

on:
  workflow_dispatch:
    inputs:
      index-limit:
        description: "Maximum number of new PDFs to OCR this run"
        required: false
        default: "200"

permissions:
  contents: write

concurrency:
  group: index-proceedings-data
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: python -m pip install -r requirements.txt PyMuPDF pytesseract Pillow

      - name: OCR-index order PDFs
        run: python fetch.py --action index --index-limit "${{ github.event.inputs.index-limit }}"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-data.json
          if git diff --cached --quiet; then
            echo "No index changes to commit."
            exit 0
          fi
          git commit -m "Update EPFO order OCR index"
          git pull --rebase
          git push
